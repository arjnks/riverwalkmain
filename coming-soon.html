<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riverwalk — Coming Soon</title>
    <meta name="description" content="Riverwalk Convention Centre. Waterfront luxury on an uncompromised scale. Coming Soon.">
    <link rel="stylesheet" href="css/style.css">
    <!-- GSAP for complex physics-based animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        /* =============================================
           BRUTALIST COMING SOON OVERRIDES
        ============================================= */
        body {
            overflow: hidden; 
            background: var(--primary);
            cursor: none; 
            font-family: 'Poppins', sans-serif;
            color: var(--white);
        }

        .coming-soon-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--primary);
        }

        /* -------------------------------------
           THE CINEMATIC SLIDER & SVG DISPLACEMENT
        -------------------------------------- */
        .cs-slider {
            position: absolute;
            inset: -5%; 
            z-index: 0;
            width: 110%;
            height: 110%;
            will-change: transform;
            filter: url(#liquid); 
            transform: scale(1.05); 
        }

        .cs-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0; 
            will-change: opacity;
        }

        .cs-slide.active {
            opacity: 1;
        }

        .cs-overlay {
            position: absolute;
            inset: 0;
            background: var(--primary);
            opacity: 0.35; 
            z-index: 1;
            mix-blend-mode: multiply;
        }

        .cs-grain {
            position: absolute;
            inset: -150%;
            z-index: 10;
            pointer-events: none;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.05; 
            animation: noise 0.5s steps(2) infinite;
            mix-blend-mode: overlay;
        }

        @keyframes noise {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }

        /* -------------------------------------
           ASYMMETRICAL LAYOUT & TYPOGRAPHY
        -------------------------------------- */
        .cs-ui {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through except on interactive elements */
            opacity: 0; /* GSAP reveal */
        }

        .micro-text {
            position: absolute;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
        }

        .micro-top-left { top: 40px; left: 40px; }
        .micro-top-right { top: 40px; right: 40px; text-align: right; }
        
        .cs-brand-container {
            position: absolute;
            bottom: -2vw;
            left: -1vw;
            pointer-events: auto;
        }

        .cs-brand {
            font-family: 'Playfair Display', serif;
            font-size: clamp(5rem, 15vw, 15rem);
            color: var(--white);
            letter-spacing: -0.05em; /* Negative tracking */
            line-height: 0.8;
            text-transform: uppercase;
            overflow: hidden; 
            margin: 0;
            white-space: nowrap;
        }

        .cs-brand .char {
            display: inline-block;
            transform: translateY(110%);
        }
        
        .cs-brand .char.dot {
            color: var(--accent);
        }

        .cs-subtitle-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            pointer-events: auto;
        }

        .cs-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 4rem);
            color: var(--accent);
            font-style: italic;
            letter-spacing: -0.02em;
            margin: 0 0 10px 0;
            line-height: 1;
            overflow: hidden;
        }

        .cs-subtitle span {
            display: inline-block;
            transform: translateY(110%);
        }

        /* -------------------------------------
           BRUTALIST EMAIL CAPTURE
        -------------------------------------- */
        .cs-capture-container {
            position: absolute;
            top: 120px;
            right: 40px;
            width: 400px;
            pointer-events: auto;
            z-index: 30;
            background: rgba(10, 10, 10, 0.85); /* Solid brutalist block */
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .cs-capture-form {
            position: relative;
            width: 100%;
        }

        .cs-input-line {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
            color: var(--white);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            padding: 10px 0;
            outline: none;
            text-align: right;
            text-transform: uppercase;
            transition: border-color 0.4s, padding 0.4s;
            cursor: none;
        }

        .cs-input-line::placeholder {
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .cs-input-line:focus {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
        }

        .cs-submit-trigger {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--accent);
            padding: 8px 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, background 0.3s, color 0.3s;
        }

        .cs-input-line:focus ~ .cs-submit-trigger,
        .cs-input-line:not(:placeholder-shown) ~ .cs-submit-trigger {
            opacity: 1;
            pointer-events: auto;
        }

        .cs-submit-trigger:hover {
            background: var(--accent);
            color: var(--primary);
        }

        /* Dynamic Image Caption */
        .cs-caption {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .cs-caption-num {
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent);
            font-size: 12px;
            letter-spacing: 2px;
        }

        .cs-caption-title {
            font-family: 'Playfair Display', serif;
            color: var(--white);
            font-size: 1.5rem;
            font-style: italic;
            letter-spacing: 1px;
        }

        /* -------------------------------------
           MASSIVE PERCENTAGE PRELOADER
        -------------------------------------- */
        #brutalist-preloader {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #050505;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 40px;
            pointer-events: all;
        }

        .preloader-counter {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6rem, 25vw, 25rem);
            color: var(--accent);
            line-height: 0.7;
            letter-spacing: -0.05em;
            margin: 0;
            mix-blend-mode: difference;
        }

        .preloader-label {
            position: absolute;
            top: 40px;
            left: 40px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Social Icons */
        .cs-socials-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            display: flex;
            flex-direction: row;
            gap: 30px;
        }

        .cs-socials-container a {
            color: rgba(255, 255, 255, 0.9);
            transition: color 0.3s, transform 0.3s;
        }

        .cs-socials-container a:hover {
            color: var(--accent);
            transform: translateY(-5px);
        }

        .cs-socials-container svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .cs-brand { font-size: 6rem; bottom: -1vw; left: 0; }
            .micro-top-right, .cs-caption { display: none; }
            .cs-input-line { font-size: 2rem; }
            .cs-subtitle-container { bottom: 20px; right: 20px; }
            .cs-subtitle { font-size: 2rem; }
        }
    </style>
</head>
<body class="preloading">

    <!-- INVISIBLE LIQUID FILTER FOR TRANSITIONS -->
    <svg style="display:none;">
        <defs>
            <filter id="liquid" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.00" numOctaves="3" result="noise" id="turbulence" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" id="displacement" /> 
            </filter>
        </defs>
    </svg>

    <!-- BRUTALIST PRELOADER -->
    <div id="brutalist-preloader">
        <div class="preloader-label">INITIALIZING SEQUENCE...</div>
        <div class="preloader-counter" id="counter">000</div>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="coming-soon-wrapper">
        <div class="cs-grain"></div>
        
        <!-- THE CINEMATIC SLIDER -->
        <div class="cs-slider" id="slider">
            <!-- JS will inject .cs-slide elements here -->
        </div>

        <div class="cs-overlay"></div>

        <!-- UI LAYER -->
        <div class="cs-ui">
            <!-- Micro Typography -->
            <div class="micro-text micro-top-left">SYS.STATUS: ONLINE<br>ENV: LUXURY.BETA</div>
            <div class="micro-text micro-top-right">COORD: 10.5276° N, 76.2144° E<br>THRISSUR, KERALA</div>

            <!-- Socials -->
            <div class="cs-socials-container">
                <a href="#" class="social-link" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg></a>
                <a href="#" class="social-link" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12,2.16c3.2,0,3.58,0,4.85.07,3.25.15,4.77,1.69,4.92,4.92.06,1.27.07,1.65.07,4.85s0,3.58-.07,4.85c-.15,3.23-1.66,4.77-4.92,4.92-1.27.06-1.64.07-4.85.07s-3.58,0-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.64-.07-4.85s0-3.58.07-4.85C2.38,3.92,3.9,2.38,7.15,2.23,8.42,2.18,8.8,2.16,12,2.16ZM12,0C8.74,0,8.33,0,7.05.07c-4.27.2-6.78,2.71-7,7C0,8.33,0,8.74,0,12s0,3.67.07,4.95c.2,4.27,2.71,6.78,7,7C8.33,24,8.74,24,12,24s3.67,0,4.95-.07c4.27-.2,6.78-2.71,7-7C24,15.67,24,15.26,24,12s0-3.67-.07-4.95c-.2-4.27-2.71-6.78-7-7C15.67,0,15.26,0,12,0Zm0,5.83a6.17,6.17,0,1,0,6.17,6.17A6.17,6.17,0,0,0,12,5.83Zm0,10.16a4,4,0,1,1,4-4A4,4,0,0,1,12,16ZM18.4,4.16a1.44,1.44,0,1,0,1.44,1.44A1.44,1.44,0,0,0,18.4,4.16Z"/></svg></a>
                <a href="#" class="social-link" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M18.77,7.46H14.5v-1.9c0-.9.6-1.1,1-1.1h3V.5h-4.33C10.24.5,9.5,3.44,9.5,5.32v2.15h-3v4h3v12h5v-12h3.85l.42-4Z"/></svg></a>
                <a href="#" class="social-link" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a>
            </div>

            <!-- Dynamic Caption -->
            <div class="cs-caption">
                <span class="cs-caption-num" id="slide-num">01</span>
                <span class="cs-caption-title" id="slide-name">The Grand Exterior</span>
            </div>

            <!-- Brutalist Email Capture -->
            <div class="cs-capture-container">
                <form class="cs-capture-form" onsubmit="event.preventDefault(); alert('Email captured.');">
                    <input type="email" class="cs-input-line" placeholder="[ ENTER EMAIL ]" required>
                    <button type="submit" class="cs-submit-trigger btn">Submit</button>
                </form>
            </div>

            <!-- Asymmetrical Logo & Subtitle -->
            <div class="cs-subtitle-container">
                <h2 class="cs-subtitle"><span>Coming</span></h2>
                <h2 class="cs-subtitle"><span>Soon</span></h2>
            </div>
            
            <div class="cs-brand-container">
                <h1 class="cs-brand"></h1>
            </div>
        </div>
    </div>

    <script>
        const slides = [
            { src: 'assets/river_walk_events-leo_group-pages-1_p1.webp', name: 'The Grand Exterior' },
            { src: 'assets/river_walk_events-leo_group-pages-2_p1.webp', name: 'The Estuary Ballroom' },
            { src: 'assets/river_walk_events-leo_group-pages-3_p1.webp', name: 'Marina Suites' },
            { src: 'assets/river_walk_events-leo_group-pages-4_p1.webp', name: 'Architectural Detail' },
            { src: 'assets/river_walk_events-leo_group-pages-5_p1.webp', name: 'Banquet Lounge' },
            { src: 'assets/river_walk_events-leo_group-pages-6_p1.webp', name: 'Evening Setup' },
            { src: 'assets/river_walk_events-leo_group-pages-7_p1.webp', name: 'Crystal Hall' },
            { src: 'assets/river_walk_events-leo_group-pages-8_p1.webp', name: 'The Waterfront' }
        ];

        (function() {
            // 1. DYNAMIC DOM INJECTION
            const sliderContainer = document.getElementById('slider');
            let slideElements = [];
            slides.forEach((slide, index) => {
                const div = document.createElement('div');
                div.classList.add('cs-slide');
                if(index === 0) div.classList.add('active');
                div.style.backgroundImage = `url('${slide.src}')`;
                sliderContainer.appendChild(div);
                slideElements.push(div);
            });

            const brandText = document.querySelector('.cs-brand');
            const text = "RIVERWALK";
            brandText.innerHTML = '';
            text.split('').forEach(char => {
                const span = document.createElement('span');
                span.classList.add('char');
                span.textContent = char;
                brandText.appendChild(span);
            });
            const dot = document.createElement('span');
            dot.classList.add('char', 'dot');
            dot.textContent = '.';
            brandText.appendChild(dot);

            // 2. MASSIVE PERCENTAGE PRELOADER
            const preloader = document.getElementById('brutalist-preloader');
            const counterEl = document.getElementById('counter');
            
            let loadState = { val: 0 };
            
            // GSAP tween for the counter to 100
            gsap.to(loadState, {
                val: 100,
                duration: 2.5,
                ease: "power4.inOut",
                onUpdate: () => {
                    // Format to 3 digits (e.g. 008, 045, 100)
                    counterEl.textContent = String(Math.floor(loadState.val)).padStart(3, '0');
                },
                onComplete: () => {
                    initSequence();
                }
            });

            // 3. SHUTTER REVEAL SEQUENCE
            function initSequence() {
                const tl = gsap.timeline();

                // Shutter open the preloader
                tl.to(preloader, {
                    yPercent: -100,
                    duration: 1.2,
                    ease: "expo.inOut"
                })
                .set(preloader, { display: 'none' })
                
                // Fade in UI container
                .to('.cs-ui', { opacity: 1, duration: 0.1 }, "-=0.5")
                
                // Reveal Brand characters aggressively
                .to('.cs-brand .char', {
                    y: '0%',
                    duration: 1.2,
                    stagger: 0.05,
                    ease: "expo.out"
                }, "-=0.5")

                // Subtitle reveal
                .to('.cs-subtitle span', {
                    y: '0%',
                    duration: 1,
                    stagger: 0.1,
                    ease: "power3.out"
                }, "-=1")

                // Input and Microtext fade in
                .fromTo(['.cs-capture-container', '.micro-text', '.cs-caption', '.cs-socials-container'],
                    { opacity: 0, y: 20 },
                    { opacity: 1, y: 0, duration: 1, stagger: 0.1, ease: "power2.out" },
                    "-=0.8"
                );
            }

            // 4. SVG DISPLACEMENT LIQUID WIPE SLIDESHOW
            let currentSlide = 0;
            const turbulence = document.getElementById('turbulence');
            const displacement = document.getElementById('displacement');
            const slideNumEl = document.getElementById('slide-num');
            const slideNameEl = document.getElementById('slide-name');

            function nextSlide() {
                const prevSlide = currentSlide;
                currentSlide = (currentSlide + 1) % slides.length;
                
                const slideTl = gsap.timeline();

                // Spike the displacement scale and frequency for a violent wipe
                slideTl.to(turbulence, { attr: { baseFrequency: "0.05 0.05" }, duration: 0.5, ease: "power2.in" })
                       .to(displacement, { attr: { scale: 100 }, duration: 0.5, ease: "power2.in" }, "<")
                       
                       // Crossfade images at peak distortion
                       .to(slideElements[prevSlide], { opacity: 0, duration: 0.1 }, "+=0")
                       .to(slideElements[currentSlide], { opacity: 1, duration: 0.1 }, "<")
                       
                       // Calm the distortion down
                       .to(turbulence, { attr: { baseFrequency: "0.00 0.00" }, duration: 1.5, ease: "power3.out" })
                       .to(displacement, { attr: { scale: 0 }, duration: 1.5, ease: "power3.out" }, "<");

                // Update Caption dynamically
                gsap.to([slideNumEl, slideNameEl], {
                    opacity: 0,
                    y: -10,
                    duration: 0.5,
                    onComplete: () => {
                        slideNumEl.textContent = `0${currentSlide + 1}`;
                        slideNameEl.textContent = slides[currentSlide].name;
                        gsap.to([slideNumEl, slideNameEl], { opacity: 1, y: 0, duration: 0.5 });
                    }
                });
            }

            setInterval(nextSlide, 5000); 

            // 5. MOUSE PARALLAX TRACKER
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let targetParallaxX = 0;
            let targetParallaxY = 0;
            let currentParallaxX = 0;
            let currentParallaxY = 0;
            
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                targetParallaxX = (mouseX / window.innerWidth - 0.5) * -50; 
                targetParallaxY = (mouseY / window.innerHeight - 0.5) * -50;
            });

            let scale = 1.05;
            let zoomDir = 1;
            function render() {
                currentParallaxX += (targetParallaxX - currentParallaxX) * 0.05;
                currentParallaxY += (targetParallaxY - currentParallaxY) * 0.05;
                
                scale += 0.0001 * zoomDir;
                if(scale > 1.15) zoomDir = -1;
                if(scale < 1.05) zoomDir = 1;

                sliderContainer.style.transform = `translate(${currentParallaxX}px, ${currentParallaxY}px) scale(${scale})`;
                requestAnimationFrame(render);
            }
            render();

        })();
    </script>
    <script src="js/main.js"></script>
</body>
</html>
