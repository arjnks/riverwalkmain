<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riverwalk — The Sequence</title>
    <meta name="description" content="Riverwalk Convention Centre Cinematic Intro Sequence.">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- GSAP Core & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #000;
            overflow-x: hidden;
            cursor: none; 
            font-family: 'Poppins', sans-serif;
        }

        #intro-section {
            position: relative;
            width: 100vw;
            height: 100svh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .cs-brand {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 15vw, 15rem);
            color: var(--white, #fff);
            font-weight: 400;
            margin: 0;
            line-height: 0.8;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .char {
            display: inline-block;
            opacity: 0;
            will-change: transform, opacity;
        }

        .cs-brand-container {
            z-index: 10;
        }

        .micro-text {
            position: absolute;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.5;
            z-index: 10;
        }
        .micro-top-left { top: 40px; left: 40px; }
        .micro-top-right { top: 40px; right: 40px; text-align: right; }

        .razor-line-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 1px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            transform: translateX(-50%);
            overflow: hidden;
            z-index: 10;
        }
        
        .razor-line {
            width: 100%;
            height: 100%;
            background: var(--accent, #C5A880);
            transform-origin: top;
            transform: scaleY(0);
            will-change: transform;
        }

        /* Ambient Background Slideshow */
        #intro-slideshow {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .intro-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: grayscale(100%);
            will-change: opacity, transform;
        }

        #intro-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7); /* Deep darkness to preserve text contrast */
            z-index: 5;
        }

        /* 2. Pinned Sequence */
        #pinned-section {
            position: relative;
            width: 100vw;
            height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        .seq-slide {
            position: absolute;
            inset: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; 
        }

        .seq-image {
            position: absolute;
            z-index: 5;
            width: 100vw;
            height: 100svh; 
            background-size: cover;
            background-position: center;
            pointer-events: none;
            will-change: opacity, transform;
        }

        .seq-text {
            position: absolute;
            z-index: 10;
            font-family: 'Playfair Display', serif; 
            font-size: clamp(3rem, 7vw, 8rem);
            color: #fff;
            text-align: center;
            font-style: italic;
            line-height: 1;
            letter-spacing: -0.02em;
            pointer-events: none;
            mix-blend-mode: difference;
            white-space: nowrap;
            will-change: opacity, transform;
        }

        #coming-soon-container {
            position: relative;
            width: 100vw;
            min-height: 100svh;
            height: auto;
            padding-bottom: 40vh; /* Critical: Gives the browser enough room to scroll the form up when the keyboard opens */
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        #coming-soon-giant {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 12vw, 15rem);
            color: var(--accent, #C5A880);
            letter-spacing: -0.05em;
            text-transform: uppercase;
            line-height: 1;
        }

        .cs-footer {
            display: flex;
            justify-content: space-between;
            width: 80%;
            max-width: 1200px;
            margin-top: 5vh;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 2rem;
            pointer-events: auto; /* allow clicks */
        }

        .cs-email, .cs-socials {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cs-socials {
            text-align: right;
            align-items: flex-end;
        }

        .cs-label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 5px;
        }

        .cs-footer a {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.3s;
            text-transform: uppercase;
        }

        .cs-footer a:hover {
            color: var(--accent, #C5A880);
        }

        .cs-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
        }

        .cs-form input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 16px; /* 16px prevents iOS Safari from zooming in */
            padding: 10px 0;
            width: 100%;
            outline: none;
            transition: border-color 0.3s;
            pointer-events: auto; /* allow typing */
            letter-spacing: 1px;
        }

        .cs-form input:focus {
            border-bottom-color: var(--accent, #C5A880);
        }

        .cs-form input::placeholder {
            color: rgba(255,255,255,0.3);
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-style: italic;
        }

        .cs-form button {
            background: var(--accent, #C5A880);
            color: #000;
            border: none;
            padding: 15px 0;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            pointer-events: auto;
            width: 100%;
            margin-top: 10px;
            font-weight: 600;
        }

        .cs-form button:hover {
            background: #fff;
        }

        /* Fixed Enquire Button */
        #fixed-enquire-btn {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 100;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 10px 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
            pointer-events: auto;
        }

        #fixed-enquire-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Custom Cursor styling */
        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background-color: var(--accent, #C5A880);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
        }

        .cursor-outline {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid var(--accent, #C5A880);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        .cursor-outline {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid var(--accent, #C5A880);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            body, html {
                cursor: auto;
            }
            .cursor-dot, .cursor-outline {
                display: none !important;
            }
            .cs-footer {
                flex-direction: column;
                align-items: center;
                gap: 40px;
                text-align: center;
            }
            .cs-socials {
                align-items: center;
                text-align: center;
            }
            .cs-form {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .cs-email {
                align-items: center;
            }
            .micro-text {
                font-size: 8px;
            }
            .micro-top-left { top: 20px; left: 20px; }
            .micro-top-right { display: none; /* Hide top right to make room for enquire button */ }
            
            #fixed-enquire-btn {
                top: 20px;
                right: 20px;
                padding: 8px 15px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <button id="fixed-enquire-btn" onclick="window.open('https://wa.me/917736728416?text=Hi%2C%20I%27m%20interested%20in%20Leo%20Convention%20Centre', '_blank')">ENQUIRE</button>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <!-- 1. INTRO LANDING PAGE -->
    <div id="intro-section">
        <div id="intro-slideshow"></div>
        <div id="intro-overlay"></div>
        <div class="micro-text micro-top-left" id="micro-1">SYS.STATUS: ONLINE<br>ENV: LUXURY.BETA</div>
        <div class="micro-text micro-top-right" id="micro-2">COORD: 10.5276° N, 76.2144° E<br>THRISSUR, KERALA</div>
        <div class="cs-brand-container">
            <h1 class="cs-brand" id="brand-text">RIVERWALK.</h1>
        </div>
        <div class="razor-line-container"><div class="razor-line" id="razor-line"></div></div>
    </div>

    <!-- 2. SCROLL SEQUENCE -->
    <div id="pinned-section">
        <!-- Slides dynamically injected here -->
    </div>

    <!-- 3. FOOTER / CONTACT SECTION -->
    <div id="coming-soon-container">
        <div id="coming-soon-giant">Coming Soon</div>
        <div class="cs-footer">
            <div class="cs-email">
                <span class="cs-label">DIRECT INQUIRY</span>
                <div class="cs-form">
                    <button onclick="window.open('https://wa.me/917736728416?text=Hi%2C%20I%27m%20interested%20in%20Leo%20Convention%20Centre', '_blank')">WHATSAPP US</button>
                </div>
            </div>
            <div class="cs-socials">
                <span class="cs-label">SOCIALS</span>
                <a href="#">INSTAGRAM</a>
                <a href="#">FACEBOOK</a>
                <a href="#">YOUTUBE</a>
            </div>
        </div>
    </div>
    
    <script>
        gsap.registerPlugin(ScrollTrigger);
        ScrollTrigger.config({ 
            ignoreMobileResize: true,
            autoRefreshEvents: "visibilitychange,DOMContentLoaded,load" // Brutally forces GSAP to ignore all resizes (including keyboards)
        });

        // Global Slides Array
        const slides = [
            { src: 'assets/river_walk_events-leo_group-pages-1_p1.webp', name: 'The Grand Exterior' },
            { src: 'assets/river_walk_events-leo_group-pages-2_p1.webp', name: 'The Estuary Ballroom' },
            { src: 'assets/river_walk_events-leo_group-pages-3_p1.webp', name: 'Luxury Banquet' },
            { src: 'assets/river_walk_events-leo_group-pages-4_p1.webp', name: 'Pre-function Lounge' },
            { src: 'assets/river_walk_events-leo_group-pages-5_p1.webp', name: 'The Suite Walk' },
            { src: 'assets/river_walk_events-leo_group-pages-6_p1.webp', name: 'Executive Quarters' },
            { src: 'assets/river_walk_events-leo_group-pages-7_p1.webp', name: 'The Waterfront' },
            { src: 'assets/river_walk_events-leo_group-pages-8_p1.webp', name: 'Night Illumination' }
        ];

        // --- 1. Brutalist Intro Animations ---
        
        // Setup Intro Ambient Slideshow
        const introSlideshowContainer = document.getElementById('intro-slideshow');
        slides.forEach((slide) => {
            const slideDiv = document.createElement('div');
            slideDiv.className = 'intro-slide';
            slideDiv.style.backgroundImage = `url('${slide.src}')`;
            introSlideshowContainer.appendChild(slideDiv);
        });

        const introSlideElements = document.querySelectorAll('.intro-slide');
        if (introSlideElements.length > 0) {
            gsap.set(introSlideElements[0], { opacity: 1 });
            const ambientTl = gsap.timeline({ repeat: -1 });

            for(let i=0; i<introSlideElements.length; i++) {
                const current = introSlideElements[i];
                const next = introSlideElements[(i + 1) % introSlideElements.length];
                
                // Keep current on screen for 4s while it slowly scales
                ambientTl.fromTo(current, { scale: 1 }, { scale: 1.05, duration: 4, ease: "none" }, `ambient${i}`);
                
                // At 3s, fade in the next one over 1s
                ambientTl.to(next, { opacity: 1, duration: 1, ease: "power1.inOut" }, `ambient${i}+=3`);
                
                // Reset current opacity after next is fully visible
                ambientTl.set(current, { opacity: 0 });
            }
        }
        
        // Wrap logo text in individual characters
        const brandText = document.getElementById('brand-text');
        const textStr = brandText.innerText;
        brandText.innerHTML = '';
        textStr.split('').forEach(char => {
            const charSpan = document.createElement('span');
            charSpan.className = 'char';
            charSpan.innerHTML = char === ' ' ? '&nbsp;' : char;
            brandText.appendChild(charSpan);
        });

        // Scramble Decoder for Micro Text
        function scrambleText(element) {
            const targetHTML = element.innerHTML;
            const chars = '!<>-_\\\\/[]{}—=+*^?#_';
            let iteration = 0;
            const cleanText = targetHTML.replace(/<br>/g, '\n');
            const total = cleanText.length;
            
            const interval = setInterval(() => {
                element.innerText = cleanText.split('').map((letter, index) => {
                    if(index < iteration) {
                        return cleanText[index];
                    }
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                
                element.innerHTML = element.innerText.replace(/\n/g, '<br>');
                
                if(iteration >= total) {
                    clearInterval(interval);
                    element.innerHTML = targetHTML; 
                }
                iteration += 1; // Faster decoding
            }, 15); // Faster interval
        }

        scrambleText(document.getElementById('micro-1'));
        scrambleText(document.getElementById('micro-2'));

        // Master Intro Timeline
        const introAnim = gsap.timeline();
        introAnim.fromTo('.char', {
            y: 50,
            opacity: 0
        }, {
            y: 0,
            opacity: 1,
            duration: 0.8,
            stagger: 0.03,
            ease: "expo.out"
        })
        .to('#razor-line', {
            scaleY: 1,
            duration: 1,
            ease: "power3.inOut"
        }, "-=0.6");

        // --- 2. Cinematic Scroll Sequence ---

        const container = document.getElementById('pinned-section');

        slides.forEach((slide) => {
            const slideDiv = document.createElement('div');
            slideDiv.className = 'seq-slide';
            
            const imgDiv = document.createElement('div');
            imgDiv.className = 'seq-image';
            imgDiv.style.backgroundImage = `url('${slide.src}')`;
            
            const textDiv = document.createElement('div');
            textDiv.className = 'seq-text';
            textDiv.innerText = slide.name;
            
            slideDiv.appendChild(imgDiv);
            slideDiv.appendChild(textDiv);
            container.appendChild(slideDiv);
        });

        const slideElements = document.querySelectorAll('.seq-slide');
        const comingSoonContainer = document.getElementById('coming-soon-container');

        // Initial setup: only the first slide is visible
        gsap.set(slideElements[0], { opacity: 1 });

        // Intro Parallax Effect (slides up slower than scroll)
        gsap.to('.cs-brand', {
            y: -150,
            opacity: 0,
            ease: "none",
            scrollTrigger: {
                trigger: "#intro-section",
                start: "top top",
                end: "bottom top",
                scrub: true
            }
        });

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "#pinned-section",
                start: "top top",
                end: `+=${slides.length * 400}%`, // Massively increased scroll distance for slower transitions
                pin: true,
                scrub: 1
            }
        });

        // Loop through slides and create the transitions WITH BLACKOUT GAPS
        for (let i = 0; i < slideElements.length - 1; i++) {
            const img = slideElements[i].querySelector('.seq-image');
            
            // Image starts small and scales up to fill the screen
            tl.fromTo(img, 
                { scale: 0.4, borderRadius: "100px" }, 
                { scale: 1.0, borderRadius: "0px", duration: 0.8, ease: "power2.inOut" }, 
                `phase${i}`
            );

            // Continuous slow zoom after filling screen
            tl.to(img, { scale: 1.1, duration: 1.2, ease: "none" }, `phase${i}+=0.8`);

            // Fast B&W to Color transition (reaches full color before fade out)
            tl.fromTo(img, 
                { filter: 'grayscale(100%)' }, 
                { filter: 'grayscale(0%)', duration: 0.8, ease: "none" }, 
                `phase${i}`
            );

            // Transition: Current slide fades out to pure black
            tl.to(slideElements[i], { opacity: 0, duration: 1, ease: "power1.inOut" }, `phase${i}+=1`)
              // Black void gap (no image visible)
              .to({}, { duration: 0.5 })
              // Next slide fades in from black
              .to(slideElements[i+1], { opacity: 1, duration: 1, ease: "power1.inOut" });
        }

        // Final Transition: Last slide fades out, Coming Soon fades in
        const lastIndex = slideElements.length - 1;
        const lastImg = slideElements[lastIndex].querySelector('.seq-image');
        
        tl.fromTo(lastImg, 
            { scale: 0.4, borderRadius: "100px" }, 
            { scale: 1.0, borderRadius: "0px", duration: 0.8, ease: "power2.inOut" }, 
            `phase${lastIndex}`
        );
        
        tl.to(lastImg, { scale: 1.1, duration: 1.2, ease: "none" }, `phase${lastIndex}+=0.8`);

        tl.fromTo(lastImg, 
            { filter: 'grayscale(100%)' }, 
            { filter: 'grayscale(0%)', duration: 0.8, ease: "none" }, 
            `phase${lastIndex}`
        );

        tl.to(slideElements[lastIndex], { opacity: 0, duration: 1, ease: "power1.inOut" }, `phase${lastIndex}+=1`)
          .to({}, { duration: 0.5 }); // Final black void gap

        // Custom Cursor Logic
        const cursorDot = document.getElementById('cursor-dot');
        const cursorOutline = document.getElementById('cursor-outline');
        
        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
            
            cursorOutline.animate({
                left: e.clientX + 'px',
                top: e.clientY + 'px'
            }, { duration: 500, fill: "forwards" });
        });
    </script>
</body>
</html>
